<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>持股背離風險追蹤系統</title>
    <style>
        :root {
            --bg-color: #f8f9fa; --card-bg: #ffffff; --text-main: #212529; --border-color: #dee2e6;
            --primary: #0d6efd; --normal-bg: #d1e7dd; --normal-text: #0f5132;
            --warning-bg: #fff3cd; --warning-text: #664d03; --danger-bg: #f8d7da; --danger-text: #842029;
            
            --tag-0: transparent;
            --tag-1: #CCF9FF80; 
            --tag-2: #CCEBFF80; 
            --tag-3: #CCDEFF80;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px 30px; }
        
        .container { max-width: 1650px; margin: 0 auto; background: var(--card-bg); padding: 20px 30px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: nowrap; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        
        h2 { margin: 0; color: #333; font-size: 22px; white-space: nowrap; }
        
        .input-group { display: flex; align-items: center; gap: 8px; }
        .panel-group { display: flex; align-items: center; gap: 8px; background: #f1f3f5; padding: 6px 12px; border-radius: 6px; }
        
        input[type="text"] { padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 4px; width: 130px; font-size: 14px; }
        select { padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 14px; cursor: pointer; }
        button { padding: 6px 16px; background-color: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; }
        button:hover { opacity: 0.9; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; font-size: 14px; }
        th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        th { background-color: #f1f3f5; font-weight: 600; color: #495057; font-size: 14px;}
        
        .cell-flex { display: flex; align-items: center; gap: 10px; }
        .stock-code { font-weight: 700; font-size: 15px; width: 55px; flex-shrink: 0; }
        .stock-name { font-size: 13px; color: #6c757d; width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
        
        .action-group { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
        .action-btn { 
            height: 22px; min-width: 22px; padding: 0 4px; font-size: 10px; 
            background-color: #adb5bd; border-radius: 4px; border: none; color: white; cursor: pointer; 
            display: inline-flex; align-items: center; justify-content: center;
            white-space: nowrap; flex-shrink: 0;
        }
        .action-btn:hover:not(:disabled) { background-color: #6c757d; }
        .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .delete-btn { background-color: #dc3545; padding: 0 8px; margin-left: 4px; }
        .delete-btn:hover:not(:disabled) { background-color: #bb2d3b; }
        .action-btn svg { display: block; width: 12px; height: 12px; }
        
        .row-color-0 { background-color: var(--tag-0); }
        .row-color-1 { background-color: var(--tag-1); }
        .row-color-2 { background-color: var(--tag-2); }
        .row-color-3 { background-color: var(--tag-3); }
        
        .color-dot { 
            display: inline-block; width: 14px; height: 14px; border-radius: 50%; 
            border: 1.5px solid #adb5bd; cursor: pointer; flex-shrink: 0;
            transition: transform 0.1s;
        }
        .color-dot:hover:not([style*="cursor:not-allowed"]) { transform: scale(1.2); }
        .color-dot.color-0 { background-color: #fff; }
        .color-dot.color-1 { background-color: #CCF9FF; border-color: #81d4fa; }
        .color-dot.color-2 { background-color: #CCEBFF; border-color: #90caf9; }
        .color-dot.color-3 { background-color: #CCDEFF; border-color: #b39ddb; }

        /* === 測試欄位輸入框樣式 === */
        .test-input { 
            width: 70px; padding: 2px 6px; border: 1px solid #ced4da; border-radius: 4px; 
            font-size: 14px; font-weight: 700; text-align: left; background-color: #fff;
            color: #212529; transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .test-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(13,110,253,.25); }
        .test-input::-webkit-outer-spin-button, .test-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .test-input[type=number] { -moz-appearance: textfield; }

        .score-group { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .score-badge { border-radius: 4px; font-weight: 700; display: inline-block; text-align: center; }
        
        .badge-sm { padding: 2px 4px; font-size: 11px; min-width: 34px; opacity: 0.25; }
        .badge-md { padding: 3px 6px; font-size: 12px; min-width: 40px; opacity: 0.4; }
        .badge-lg { 
            padding: 4px 10px; font-size: 14px; min-width: 48px; opacity: 1; 
            cursor: pointer; transition: transform 0.1s ease, outline 0.1s ease; 
        }
        .badge-lg:hover { transform: scale(1.05); }

        .status-normal { background-color: var(--normal-bg); color: var(--normal-text); }
        .status-warning { background-color: var(--warning-bg); color: var(--warning-text); }
        .status-danger { background-color: var(--danger-bg); color: var(--danger-text); }
        .sim-active { outline: 2px dashed #ff7b7b; outline-offset: 1px; }
        
        .note { color: #6c757d; font-size: 13px; white-space: nowrap; }
        .loading { text-align: center; color: #0d6efd; font-weight: bold; padding: 15px; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <div class="header-left">
            <h2>持股背離風險追蹤</h2>
            <div class="input-group">
                <input type="text" id="stockInput" placeholder="輸入代號 (如 3081)" onkeypress="handleEnter(event)">
                <button onclick="addStock()">新增</button>
                <span class="note">上限 <span id="stockCount">0</span>/20</span>
            </div>
        </div>

        <div class="panel-group">
            <label for="sentimentSelect" style="font-size:14px; font-weight:600; color:#495057;">市場情緒 (調節係數)：</label>
            <select id="sentimentSelect" onchange="changeSentiment()">
                <option value="-1">多頭樂觀</option>
                <option value="0">半信半疑</option>
                <option value="1">恐慌情緒</option>
            </select>
        </div>
    </div>

    <table id="stockTable">
        <thead>
            <tr>
                <th width="35%">代號</th>
                <th width="13%">收盤價</th>
                <th width="13%">20MA</th>
                <th width="13%">60MA</th>
                <th width="13%">120MA</th>
                <th width="13%">風險數值</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>
</div>

<script>
    const MAX_STOCKS = 20;
    let stockList = JSON.parse(localStorage.getItem('divergence_stocks_v8')) || [];
    let stockColors = JSON.parse(localStorage.getItem('divergence_colors_v8')) || {};
    let currentSentiment = parseInt(localStorage.getItem('divergence_sentiment_v8'));
    
    if (isNaN(currentSentiment)) currentSentiment = -1;
    document.getElementById('sentimentSelect').value = currentSentiment;

    let cachedMarketData = {};
    let simulationMode = {}; 

    // 測試區塊獨立數據模型
    let testData = { p: 100, m20: 100, m60: 100, m120: 100 };
    let isTestSimulated = false;

    const iconToTop = `<svg viewBox="0 0 24 24"><polygon points="12,1 23,21 1,21" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><polygon points="12,7.5 17.5,17 6.5,17" fill="currentColor"/></svg>`;
    const iconToBottom = `<svg viewBox="0 0 24 24"><polygon points="12,23 23,3 1,3" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><polygon points="12,16.5 17.5,7 6.5,7" fill="currentColor"/></svg>`;

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // --- 測試區塊專用邏輯 ---
    const testScoreUI = () => {
        let p = parseFloat(testData.p), m20 = parseFloat(testData.m20), m60 = parseFloat(testData.m60), m120 = parseFloat(testData.m120);
        if (isNaN(p) || isNaN(m20) || isNaN(m60) || isNaN(m120) || m20 === 0 || m60 === 0 || m120 === 0) {
            return { s: "-", cls: "status-normal" };
        }
        let priceToCalc = isTestSimulated ? p * 1.1 : p;
        let score = calculateScore(priceToCalc, m20, m60, m120);
        return { s: score.toFixed(2), cls: getStatusClass(score) };
    };

    window.calcTestScoreUI = function() {
        let ui = testScoreUI();
        let sm = document.getElementById('testScoreSm');
        let md = document.getElementById('testScoreMd');
        let lg = document.getElementById('testScoreLg');
        
        if (sm && md && lg) {
            sm.innerHTML = ui.s; md.innerHTML = ui.s; lg.innerHTML = ui.s;
            sm.className = `score-badge badge-sm ${ui.cls}`;
            md.className = `score-badge badge-md ${ui.cls}`;
            lg.className = `score-badge badge-lg ${ui.cls}` + (isTestSimulated ? ' sim-active' : '');
        }
    };

    window.updateTestInput = function(field, elem) {
        let val = parseFloat(elem.value);
        testData[field] = isNaN(val) ? '' : val;
        calcTestScoreUI();
    };

    window.toggleTestSimulate = function() {
        isTestSimulated = !isTestSimulated;
        calcTestScoreUI();
    };

    function getTestRowHTML() {
        let t_ui = testScoreUI();
        let simClassT = isTestSimulated ? 'sim-active' : '';
        return `
            <tr style="background-color: #f1f3f5; border-bottom: 2px solid #dee2e6;">
                <td>
                    <div class="cell-flex">
                        <span class="color-dot color-0" style="cursor:not-allowed; opacity: 0.4;"></span>
                        <span class="stock-code" style="color: #6c757d;">0000</span>
                        <span class="stock-name" style="color:#495057; font-weight:600;">測試</span>
                        <div class="action-group">
                            <button class="action-btn" disabled style="cursor:not-allowed;" title="禁止操作">${iconToTop}</button>
                            <button class="action-btn" disabled style="cursor:not-allowed;" title="禁止操作">▲</button>
                            <button class="action-btn" disabled style="cursor:not-allowed;" title="禁止操作">▼</button>
                            <button class="action-btn" disabled style="cursor:not-allowed;" title="禁止操作">${iconToBottom}</button>
                            <button class="action-btn delete-btn" disabled style="cursor:not-allowed;" title="禁止操作">刪除</button>
                        </div>
                    </div>
                </td>
                <td><input type="number" class="test-input" value="${testData.p}" oninput="updateTestInput('p', this)" placeholder="價格"></td>
                <td><input type="number" class="test-input" value="${testData.m20}" oninput="updateTestInput('m20', this)" placeholder="20MA"></td>
                <td><input type="number" class="test-input" value="${testData.m60}" oninput="updateTestInput('m60', this)" placeholder="60MA"></td>
                <td><input type="number" class="test-input" value="${testData.m120}" oninput="updateTestInput('m120', this)" placeholder="120MA"></td>
                <td>
                    <div class="score-group">
                        <span id="testScoreSm" class="score-badge badge-sm ${t_ui.cls}">${t_ui.s}</span>
                        <span id="testScoreMd" class="score-badge badge-md ${t_ui.cls}">${t_ui.s}</span>
                        <span id="testScoreLg" class="score-badge badge-lg ${t_ui.cls} ${simClassT}" 
                              onclick="toggleTestSimulate()" 
                              title="點擊切換：模擬隔日漲停10%">
                            ${t_ui.s}
                        </span>
                    </div>
                </td>
            </tr>
        `;
    }
    // --- 測試區塊專用邏輯結束 ---

    loadAllData();

    function saveState() {
        localStorage.setItem('divergence_stocks_v8', JSON.stringify(stockList));
        localStorage.setItem('divergence_colors_v8', JSON.stringify(stockColors));
        localStorage.setItem('divergence_sentiment_v8', currentSentiment.toString());
    }

    function changeSentiment() {
        currentSentiment = parseInt(document.getElementById('sentimentSelect').value);
        saveState();
        drawTable(); // 重新渲染時也會觸發測試列跟隨情緒重算
    }

    window.cycleColor = function(symbol) {
        let currentColor = stockColors[symbol] || 0;
        stockColors[symbol] = (currentColor + 1) % 4; 
        saveState();
        drawTable();
    };

    window.toggleSimulate = function(symbol) {
        simulationMode[symbol] = !simulationMode[symbol];
        drawTable();
    };

    async function addStock() {
        const input = document.getElementById('stockInput');
        let symbol = input.value.trim().toUpperCase().replace(/[^A-Z0-9.]/g, '');

        if (!symbol) return;
        if (stockList.length >= MAX_STOCKS) return alert('已達持股追蹤上限 (20檔)');
        if (stockList.includes(symbol)) return alert('該股票已在清單中');

        input.disabled = true;
        document.getElementById('tableBody').innerHTML = getTestRowHTML() + `<tr><td colspan="6" class="loading">正在抓取 ${symbol} 最新資料...</td></tr>`;

        const data = await fetchRealMarketData(symbol);
        cachedMarketData[symbol] = data;
        stockList.push(symbol);
        stockColors[symbol] = 0; 
        
        saveState();
        input.value = '';
        input.disabled = false;
        input.focus();
        drawTable();
    }

    window.removeStock = function(index) {
        const symbol = stockList[index];
        stockList.splice(index, 1);
        delete cachedMarketData[symbol];
        delete stockColors[symbol];
        delete simulationMode[symbol];
        saveState();
        drawTable();
    };

    window.moveUp = function(index) {
        if (index > 0) {
            [stockList[index - 1], stockList[index]] = [stockList[index], stockList[index - 1]];
            saveState();
            drawTable();
        }
    };

    window.moveDown = function(index) {
        if (index < stockList.length - 1) {
            [stockList[index + 1], stockList[index]] = [stockList[index], stockList[index + 1]];
            saveState();
            drawTable();
        }
    };

    window.moveToTop = function(index) {
        if (index > 0) {
            const item = stockList.splice(index, 1)[0];
            stockList.unshift(item);
            saveState();
            drawTable();
        }
    };

    window.moveToBottom = function(index) {
        if (index < stockList.length - 1) {
            const item = stockList.splice(index, 1)[0];
            stockList.push(item);
            saveState();
            drawTable();
        }
    };

    function handleEnter(e) { if (e.key === 'Enter') addStock(); }

    function calculateScore(price, ma20, ma60, ma120) {
        return (3 * (price / ma20)) + (2 * (price / ma60)) + (1 * (price / ma120)) + currentSentiment;
    }

    function getStatusClass(score) {
        if (score < 10) return 'status-normal';
        if (score >= 10 && score < 12) return 'status-warning';
        return 'status-danger';
    }

    async function fetchRealMarketData(symbol) {
        try {
            let dataId = symbol.replace('.TW', '').replace('.TWO', '').trim();
            let dataset = /^[A-Z]+$/.test(dataId) ? "USStockPrice" : "TaiwanStockPrice";

            let d = new Date();
            d.setDate(d.getDate() - 250);
            let startDate = d.toISOString().split('T')[0];

            let priceUrl = `https://api.finmindtrade.com/api/v4/data?dataset=${dataset}&data_id=${dataId}&start_date=${startDate}`;
            let response = await fetch(priceUrl);
            let json = await response.json();

            if (json.status !== 200 || !json.data || json.data.length === 0) {
                throw new Error("查無代號");
            }

            let stockName = dataId; 
            if (dataset === "TaiwanStockPrice") {
                try {
                    let infoUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo&data_id=${dataId}`;
                    let infoRes = await fetch(infoUrl);
                    let infoJson = await infoRes.json();
                    if (infoJson.status === 200 && infoJson.data && infoJson.data.length > 0) {
                        stockName = infoJson.data[0].stock_name;
                    }
                } catch (e) { }
            }

            let closes = json.data.map(item => item.close || item.Close).filter(c => typeof c === 'number');

            if (closes.length < 122) throw new Error("交易日不足 122 日");

            let latestPrice = closes[closes.length - 1]; 

            return { symbol, name: stockName, price: latestPrice, closes, error: null };
        } catch (error) {
            return { symbol, name: "讀取失敗", price: 0, closes: [], error: error.message };
        }
    }

    async function loadAllData() {
        const tbody = document.getElementById('tableBody');
        document.getElementById('stockCount').innerText = stockList.length;
        
        if (stockList.length === 0) {
            drawTable(); // 即使為空也呼叫 drawTable 以顯示測試列
            return;
        }

        for (let i = 0; i < stockList.length; i++) {
            const symbol = stockList[i];
            tbody.innerHTML = getTestRowHTML() + `<tr><td colspan="6" class="loading">依序載入中，避免觸發 API 流量限制 (${i + 1}/${stockList.length}) ...</td></tr>`;
            
            const data = await fetchRealMarketData(symbol);
            cachedMarketData[symbol] = data;
            
            if (i < stockList.length - 1) await sleep(300); 
        }

        drawTable();
    }

    function drawTable() {
        const tbody = document.getElementById('tableBody');
        document.getElementById('stockCount').innerText = stockList.length;

        let htmlRows = getTestRowHTML();

        if (stockList.length === 0) {
            htmlRows += '<tr><td colspan="6" style="text-align:center; color:#6c757d; padding:20px;">目前無追蹤持股，請新增股票代號。</td></tr>';
            tbody.innerHTML = htmlRows;
            return;
        }

        let sum = (arr) => arr.reduce((a, b) => a + b, 0);
        let getMA = (closes, period, offset) => {
            const end = offset === 0 ? closes.length : -offset;
            return sum(closes.slice(-period - offset, end)) / period;
        };

        stockList.forEach((symbol, index) => {
            const data = cachedMarketData[symbol] || { symbol: symbol, error: "無效代號或未讀取", name: "未知" };
            const isFirst = index === 0;
            const isLast = index === stockList.length - 1;
            
            let colorIdx = stockColors[symbol];
            if (colorIdx === undefined || colorIdx > 3) { colorIdx = 0; stockColors[symbol] = 0; }

            if (data.error) {
                htmlRows += `
                    <tr class="row-color-${colorIdx}">
                        <td>
                            <div class="cell-flex">
                                <span class="color-dot color-${colorIdx}" onclick="cycleColor('${data.symbol}')"></span>
                                <span class="stock-code">${data.symbol}</span>
                                <div class="action-group">
                                    <button class="action-btn delete-btn" onclick="removeStock(${index})">刪除</button>
                                </div>
                            </div>
                        </td>
                        <td colspan="5" style="color:#dc3545;">${data.name} (${data.error})</td>
                    </tr>`;
                return;
            }

            const closes = data.closes;
            const len = closes.length;
            
            let p_t2 = closes[len - 3];
            let s_t2 = calculateScore(p_t2, getMA(closes, 20, 2), getMA(closes, 60, 2), getMA(closes, 120, 2));
            
            let p_t1 = closes[len - 2];
            let s_t1 = calculateScore(p_t1, getMA(closes, 20, 1), getMA(closes, 60, 1), getMA(closes, 120, 1));
            
            let p_t0 = closes[len - 1];
            let ma20_t0 = getMA(closes, 20, 0);
            let ma60_t0 = getMA(closes, 60, 0);
            let ma120_t0 = getMA(closes, 120, 0);
            let s_t0 = calculateScore(p_t0, ma20_t0, ma60_t0, ma120_t0);

            let isSimulated = simulationMode[data.symbol] || false;
            
            let displayPrice = p_t0;
            let displayMa20 = ma20_t0;
            let displayMa60 = ma60_t0;
            let displayMa120 = ma120_t0;
            
            let val1, val2, val3;

            if (isSimulated) {
                let p_sim = p_t0 * 1.1; 
                displayPrice = p_sim;
                displayMa20 = (sum(closes.slice(-19)) + p_sim) / 20;
                displayMa60 = (sum(closes.slice(-59)) + p_sim) / 60;
                displayMa120 = (sum(closes.slice(-119)) + p_sim) / 120;
                let s_sim = calculateScore(displayPrice, displayMa20, displayMa60, displayMa120);
                
                val1 = s_t1;
                val2 = s_t0;
                val3 = s_sim;
            } else {
                val1 = s_t2;
                val2 = s_t1;
                val3 = s_t0;
            }

            const simClass = isSimulated ? 'sim-active' : '';

            htmlRows += `
                <tr class="row-color-${colorIdx}">
                    <td>
                        <div class="cell-flex">
                            <span class="color-dot color-${colorIdx}" onclick="cycleColor('${data.symbol}')" title="點擊切換分類顏色"></span>
                            <span class="stock-code">${data.symbol}</span>
                            <span class="stock-name" title="${data.name}">${data.name}</span>
                            <div class="action-group">
                                <button class="action-btn" onclick="moveToTop(${index})" title="移至最上" ${isFirst ? 'disabled' : ''}>${iconToTop}</button>
                                <button class="action-btn" onclick="moveUp(${index})" title="上移" ${isFirst ? 'disabled' : ''}>▲</button>
                                <button class="action-btn" onclick="moveDown(${index})" title="下移" ${isLast ? 'disabled' : ''}>▼</button>
                                <button class="action-btn" onclick="moveToBottom(${index})" title="移至最下" ${isLast ? 'disabled' : ''}>${iconToBottom}</button>
                                <button class="action-btn delete-btn" onclick="removeStock(${index})">刪除</button>
                            </div>
                        </div>
                    </td>
                    <td><strong>${displayPrice.toFixed(2)}</strong></td>
                    <td>${displayMa20.toFixed(2)}</td>
                    <td>${displayMa60.toFixed(2)}</td>
                    <td>${displayMa120.toFixed(2)}</td>
                    <td>
                        <div class="score-group">
                            <span class="score-badge badge-sm ${getStatusClass(val1)}">${val1.toFixed(2)}</span>
                            <span class="score-badge badge-md ${getStatusClass(val2)}">${val2.toFixed(2)}</span>
                            <span class="score-badge badge-lg ${getStatusClass(val3)} ${simClass}" 
                                  onclick="toggleSimulate('${data.symbol}')" 
                                  title="點擊切換：模擬隔日漲停10%">
                                ${val3.toFixed(2)}
                            </span>
                        </div>
                    </td>
                </tr>
            `;
        });
        
        tbody.innerHTML = htmlRows;
    }
</script>
